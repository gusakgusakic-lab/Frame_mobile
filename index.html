<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Framework Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { theme: 'var(--theme-color)' }
                }
            }
        }
    </script>
    <style>
        :root {
            --theme-color: #22c55e; /* Default green */
            --theme-bg-main: #0a0a0a;
            --theme-bg-panel: #141414;
            --theme-border: #262626;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--theme-bg-main);
            color: #ffffff;
            overflow: hidden; /* Prevent pull-to-refresh on mobile */
        }
        .bg-panel { background-color: var(--theme-bg-panel); }
        .border-panel { border-color: var(--theme-border); }
        
        /* Скрытие скроллбара для красоты */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Анимации */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        #toast-container { z-index: 9999; }
        
        /* Мобильная адаптация: скрытие панелей */
        @media (max-width: 768px) {
            .mobile-hidden { display: none !important; }
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col text-sm sm:text-base">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 flex flex-col space-y-2 pointer-events-none"></div>

    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4 slide-up">
        <div class="bg-panel border border-panel p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 bg-theme rounded-2xl flex items-center justify-center text-white text-3xl mb-6 shadow-lg shadow-theme/20">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Вход в систему</h1>
            <p class="text-neutral-400 text-center mb-8">Используйте номер телефона для входа или регистрации</p>

            <div class="w-full space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Номер телефона</label>
                    <input type="text" id="auth-phone" placeholder="79991234567" class="w-full bg-[#0a0a0a] border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-theme transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Никнейм (для новых)</label>
                    <input type="text" id="auth-nick" placeholder="Alex" class="w-full bg-[#0a0a0a] border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-theme transition-colors">
                </div>
                
                <button onclick="handleAuth()" class="w-full bg-theme text-black font-semibold rounded-xl px-4 py-3 mt-4 hover:opacity-90 transition-opacity flex items-center justify-center space-x-2">
                    <span>Продолжить</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="main-screen" class="hidden flex-1 flex h-full w-full overflow-hidden fade-in">
        
        <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-panel border-r border-panel flex flex-col shrink-0 h-full">
            <!-- Шапка сайдбара -->
            <div class="p-4 border-b border-panel flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="openModal('settings-modal')">
                    <div id="current-user-avatar" class="w-10 h-10 rounded-full bg-theme flex items-center justify-center text-black font-bold">A</div>
                    <div>
                        <div id="current-user-name" class="font-semibold text-white leading-tight">Name</div>
                        <div class="text-xs text-neutral-400">Настройки</div>
                    </div>
                </div>
                <button onclick="openModal('add-contact-modal')" class="w-10 h-10 rounded-full bg-neutral-800 hover:bg-neutral-700 text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Поиск -->
            <div class="p-3 shrink-0">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-neutral-500"></i>
                    <input type="text" id="search-chats" placeholder="Поиск чатов..." onkeyup="renderChatsList(this.value)" class="w-full bg-[#0a0a0a] border border-neutral-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-theme transition-colors">
                </div>
            </div>

            <!-- Список чатов -->
            <div id="chats-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Элементы генерируются через JS -->
            </div>
        </aside>

        <main id="chat-area" class="hidden md:flex flex-1 flex-col h-full bg-[#0a0a0a] relative">
            
            <!-- Заглушка, если чат не выбран -->
            <div id="no-chat-selected" class="absolute inset-0 flex flex-col items-center justify-center text-neutral-500 z-10">
                <div class="w-24 h-24 rounded-full bg-neutral-900 flex items-center justify-center text-4xl mb-4">
                    <i class="fa-regular fa-comments"></i>
                </div>
                <p>Выберите чат для начала общения</p>
            </div>

            <header id="chat-header" class="hidden h-16 border-b border-panel bg-panel flex items-center justify-between px-4 shrink-0 z-20">
                <div class="flex items-center space-x-3">
                    <button onclick="closeChatMobile()" class="md:hidden w-8 h-8 flex items-center justify-center text-neutral-400">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="active-chat-avatar" class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center text-lg">👤</div>
                    <div>
                        <h2 id="active-chat-name" class="font-bold text-white leading-tight">Имя контакта</h2>
                        <p id="active-chat-phone" class="text-xs text-theme">В сети</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="toggleEditContactModal()" class="w-10 h-10 rounded-full hover:bg-neutral-800 text-neutral-400 transition-colors" title="Редактировать">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button onclick="deleteCurrentContact()" class="w-10 h-10 rounded-full hover:bg-neutral-800 text-red-500 transition-colors" title="Удалить чат">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </header>

            <div id="chat-messages" class="hidden flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth z-20 pb-4">
                <!-- Сообщения -->
            </div>

            <div id="chat-input-panel" class="hidden p-3 sm:p-4 bg-panel shrink-0 border-t border-panel z-20">
                <div class="flex items-end space-x-2 max-w-4xl mx-auto">
                    <!-- Кнопка вложения -->
                    <div class="flex items-center pb-1.5 shrink-0 pr-1">
                        <label class="p-2.5 bg-neutral-800 rounded-full cursor-pointer hover:bg-neutral-700 transition text-neutral-400 hover:text-theme shadow-sm">
                            <input type="file" id="chat-attachment-upload" class="hidden" onchange="sendFileMessage(event)">
                            <i class="fa-solid fa-paperclip text-lg"></i>
                        </label>
                    </div>

                    <!-- Поле ввода -->
                    <div class="flex-1 bg-black rounded-2xl border border-neutral-700 focus-within:border-theme transition-colors flex items-center relative shadow-inner min-h-[44px]">
                        <textarea id="message-input" rows="1" maxlength="1000"
                                  placeholder="Написать сообщение..." 
                                  class="w-full bg-transparent text-white px-4 py-3 focus:outline-none resize-none overflow-hidden"
                                  style="max-height: 120px;"
                                  oninput="autoResizeInput()"
                                  onkeydown="handleEnter(event)"></textarea>
                    </div>
                    
                    <!-- Кнопка отправки -->
                    <div class="flex items-center pb-1 shrink-0 pl-1">
                        <button onclick="sendTextMessage()" class="w-11 h-11 bg-theme text-black rounded-full hover:opacity-90 transition-opacity flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Добавить контакт -->
    <div id="add-contact-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-panel border border-panel rounded-2xl w-full max-w-sm p-6 slide-up">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Новый контакт</h3>
                <button onclick="closeModal('add-contact-modal')" class="text-neutral-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">Номер телефона</label>
                    <input type="text" id="new-contact-phone" class="w-full bg-black border border-neutral-800 rounded-xl px-4 py-2 text-white focus:border-theme outline-none">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">Имя</label>
                    <input type="text" id="new-contact-name" class="w-full bg-black border border-neutral-800 rounded-xl px-4 py-2 text-white focus:border-theme outline-none">
                </div>
                <button onclick="addContact()" class="w-full bg-theme text-black font-semibold rounded-xl px-4 py-2.5 mt-2">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Редактировать контакт -->
    <div id="edit-contact-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-panel border border-panel rounded-2xl w-full max-w-sm p-6 slide-up">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Изменить контакт</h3>
                <button onclick="closeModal('edit-contact-modal')" class="text-neutral-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">Новое имя</label>
                    <input type="text" id="edit-contact-name-input" class="w-full bg-black border border-neutral-800 rounded-xl px-4 py-2 text-white focus:border-theme outline-none">
                </div>
                <button onclick="saveContactEdit()" class="w-full bg-theme text-black font-semibold rounded-xl px-4 py-2.5 mt-2">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-panel border border-panel rounded-2xl w-full max-w-sm p-6 slide-up text-center">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold">Настройки</h3>
                <button onclick="closeModal('settings-modal')" class="text-neutral-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="mb-6">
                <p class="text-sm text-neutral-400 mb-3">Цвет интерфейса</p>
                <input type="range" id="theme-slider" min="0" max="360" value="142" class="w-full h-2 bg-neutral-800 rounded-lg appearance-none cursor-pointer" oninput="changeTheme(this.value)">
                <div class="w-12 h-12 mx-auto mt-4 rounded-full bg-theme shadow-[0_0_15px_var(--theme-color)] transition-colors duration-200"></div>
            </div>

            <button onclick="logout()" class="w-full border border-red-500/50 text-red-500 hover:bg-red-500 hover:text-white font-semibold rounded-xl px-4 py-2.5 transition-colors">
                Выйти из аккаунта
            </button>
        </div>
    </div>

    <script>
        // --- СОСТОЯНИЕ ПРИЛОЖЕНИЯ ---
        let state = {
            currentUser: null,
            activeChat: null,
            themeSliderValue: 142, // Default green hue
            chats: {
                'notes': { name: '(Заметки)', messages: [] }
            }
        };

        const STORAGE_KEY = 'framework_messenger_data';

        // --- УТИЛИТЫ ---
        function showToast(msg, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-theme';
            const textColor = type === 'error' ? 'text-white' : 'text-black';
            
            toast.className = `${bgColor} ${textColor} px-4 py-2 rounded-xl shadow-lg text-sm font-medium slide-up flex items-center space-x-2`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-check'}"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('slide-up', 'opacity-0');
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        // --- ХРАНИЛИЩЕ ---
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.currentUser = parsed.currentUser || null;
                    state.activeChat = parsed.activeChat || null;
                    state.themeSliderValue = parsed.themeSliderValue || 142;
                    state.chats = parsed.chats || { 'notes': { name: '(Заметки)', messages: [] } };
                    
                    // Защита: если заметок нет, создаем
                    if (!state.chats['notes']) {
                        state.chats['notes'] = { name: '(Заметки)', messages: [] };
                    }
                }
            } catch (e) { console.error("Load state error", e); }
            
            applyTheme(state.themeSliderValue);
        }

        // --- ИНИЦИАЛИЗАЦИЯ И АВТОРИЗАЦИЯ ---
        window.onload = () => {
            loadState();
            if (state.currentUser) {
                showMainScreen();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        };

        function handleAuth() {
            const phone = document.getElementById('auth-phone').value.trim();
            const nick = document.getElementById('auth-nick').value.trim();
            
            if (!phone) return showToast("Введите номер телефона", "error");
            
            // Простая локальная авторизация (эмуляция Firebase)
            state.currentUser = { 
                phone: phone, 
                nickname: nick || "Пользователь",
                avatarLetter: nick ? nick.charAt(0).toUpperCase() : phone.charAt(0)
            };
            
            saveState();
            showToast("Вход выполнен успешно");
            showMainScreen();
        }

        function logout() {
            state.currentUser = null;
            state.activeChat = null;
            saveState();
            closeModal('settings-modal');
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            showToast("Вы вышли из системы");
        }

        // --- ИНТЕРФЕЙС И ТЕМА ---
        function applyTheme(hue) {
            document.documentElement.style.setProperty('--theme-color', `hsl(${hue}, 80%, 50%)`);
            document.getElementById('theme-slider').value = hue;
        }

        function changeTheme(val) {
            state.themeSliderValue = val;
            applyTheme(val);
            saveState();
        }

        function showMainScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            
            document.getElementById('current-user-name').innerText = state.currentUser.nickname;
            document.getElementById('current-user-avatar').innerText = state.currentUser.avatarLetter;
            
            renderChatsList();
            if (state.activeChat) selectChat(state.activeChat);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // --- УПРАВЛЕНИЕ ЧАТАМИ ---
        function renderChatsList(searchQuery = "") {
            const list = document.getElementById('chats-list');
            list.innerHTML = '';
            
            // Сортировка: заметки всегда сверху, остальные по алфавиту (для простоты)
            const chatKeys = Object.keys(state.chats).sort((a, b) => {
                if (a === 'notes') return -1;
                if (b === 'notes') return 1;
                return state.chats[a].name.localeCompare(state.chats[b].name);
            });

            chatKeys.forEach(phone => {
                const chat = state.chats[phone];
                
                // Фильтр поиска
                if (searchQuery && !chat.name.toLowerCase().includes(searchQuery.toLowerCase()) && phone !== 'notes') return;

                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length - 1] : null;
                let lastTxt = "Нет сообщений";
                if (lastMsg) {
                    if (lastMsg.type === 'image') lastTxt = '📸 Фотография';
                    else if (lastMsg.type === 'file') lastTxt = '📎 Файл';
                    else lastTxt = lastMsg.text;
                }

                const isActive = state.activeChat === phone;
                const bgClass = isActive ? 'bg-theme text-black shadow-md' : 'hover:bg-neutral-800 text-white';
                const textMuted = isActive ? 'text-black/70' : 'text-neutral-400';
                const avatarIcon = phone === 'notes' ? '📝' : chat.name.charAt(0).toUpperCase();

                const el = document.createElement('div');
                el.className = `p-3 rounded-2xl cursor-pointer transition-all flex items-center space-x-3 mb-1 ${bgClass}`;
                el.onclick = () => selectChat(phone);
                el.innerHTML = `
                    <div class="w-12 h-12 rounded-full ${isActive?'bg-black/20':'bg-neutral-800'} flex items-center justify-center text-lg font-bold shrink-0">${avatarIcon}</div>
                    <div class="overflow-hidden flex-1">
                        <div class="flex justify-between items-baseline">
                            <h4 class="font-bold text-sm truncate">${chat.name}</h4>
                            ${lastMsg ? `<span class="text-[10px] ${textMuted}">${lastMsg.time}</span>` : ''}
                        </div>
                        <p class="text-xs truncate ${textMuted}">${lastTxt}</p>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function selectChat(phone) {
            state.activeChat = phone;
            saveState();
            
            // Мобильный вид: скрыть сайдбар, показать чат
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('mobile-hidden');
                document.getElementById('chat-area').classList.replace('hidden', 'flex');
            }

            document.getElementById('no-chat-selected').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-messages').classList.remove('hidden');
            document.getElementById('chat-input-panel').classList.remove('hidden');
            
            renderChatsList(); // Обновление подсветки в списке
            renderActiveChat();
        }

        function closeChatMobile() {
            document.getElementById('sidebar').classList.remove('mobile-hidden');
            document.getElementById('chat-area').classList.replace('flex', 'hidden');
        }

        function renderActiveChat() {
            if (!state.activeChat || !state.chats[state.activeChat]) return;
            
            const chat = state.chats[state.activeChat];
            const isNotes = state.activeChat === 'notes';
            
            document.getElementById('active-chat-name').innerText = chat.name;
            document.getElementById('active-chat-phone').innerText = isNotes ? 'Личное пространство' : state.activeChat;
            document.getElementById('active-chat-avatar').innerText = isNotes ? '📝' : chat.name.charAt(0).toUpperCase();
            
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            
            if (chat.messages.length === 0) {
                container.innerHTML = `<div class="text-center text-neutral-500 mt-10 text-sm">Здесь пока пусто. Напишите первое сообщение!</div>`;
                return;
            }

            chat.messages.forEach(msg => {
                const isMe = msg.senderPhone === state.currentUser.phone || isNotes;
                const alignClass = isMe ? 'justify-end' : 'justify-start';
                const bubbleClass = isMe ? 'bg-theme text-black rounded-br-sm' : 'bg-neutral-800 text-white rounded-bl-sm';
                const timeClass = isMe ? 'text-black/60' : 'text-neutral-400';

                let contentHtml = '';
                if (msg.type === 'text') {
                    // Базовая защита от XSS и поддержка переносов
                    const safeText = msg.text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
                    contentHtml = `<p class="break-words">${safeText}</p>`;
                } else if (msg.type === 'image') {
                    contentHtml = `<img src="${msg.dataUrl}" class="max-w-[200px] sm:max-w-xs rounded-xl cursor-pointer" onclick="window.open('${msg.dataUrl}')">`;
                } else if (msg.type === 'file') {
                    contentHtml = `
                        <a href="${msg.dataUrl}" download="${msg.filename}" class="flex items-center space-x-2 bg-black/20 p-2 rounded-lg hover:bg-black/30 transition">
                            <i class="fa-solid fa-file-lines text-2xl"></i>
                            <span class="text-sm truncate max-w-[150px] font-medium">${msg.filename}</span>
                        </a>`;
                }

                const el = document.createElement('div');
                el.className = `flex w-full ${alignClass} mb-2`;
                el.innerHTML = `
                    <div class="max-w-[75%] sm:max-w-md px-4 py-2.5 rounded-2xl ${bubbleClass} shadow-sm group relative">
                        ${contentHtml}
                        <div class="text-[10px] text-right mt-1 ${timeClass} flex items-center justify-end space-x-1">
                            <span>${msg.time}</span>
                            ${isMe ? '<i class="fa-solid fa-check-double text-[8px]"></i>' : ''}
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
            
            // Прокрутка вниз
            container.scrollTop = container.scrollHeight;
        }

        function autoResizeInput() {
            const el = document.getElementById('message-input');
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
            // Сброс, если пусто
            if(el.value === '') el.style.height = '44px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendTextMessage();
            }
        }

        function pushMessage(msgObj) {
            if (!state.activeChat) return;
            state.chats[state.activeChat].messages.push(msgObj);
            saveState();
            renderActiveChat();
            renderChatsList();
        }

        function sendTextMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;
            
            const msg = {
                id: Date.now(),
                type: 'text',
                text: text,
                time: formatTime(),
                senderPhone: state.currentUser.phone
            };
            
            pushMessage(msg);
            input.value = '';
            autoResizeInput();
            
            // Эмуляция ответа в обычных чатах (если это не заметки)
            if (state.activeChat !== 'notes') {
                setTimeout(() => {
                    const reply = {
                        id: Date.now()+1,
                        type: 'text',
                        text: 'Авто-ответ: сообщение получено. (Демо-режим без бэкенда)',
                        time: formatTime(),
                        senderPhone: state.activeChat
                    };
                    state.chats[state.activeChat].messages.push(reply);
                    saveState();
                    if(state.activeChat === state.activeChat) renderActiveChat();
                    renderChatsList();
                }, 1500);
            }
        }

        function sendFileMessage(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const type = file.type.startsWith('image/') ? 'image' : 'file';
            
            if(file.size > 2 * 1024 * 1024) {
                return showToast("Файл слишком большой (макс 2MB для демо)", "error");
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const msg = {
                    id: Date.now(),
                    type: type,
                    text: '',
                    filename: file.name,
                    dataUrl: e.target.result,
                    time: formatTime(),
                    senderPhone: state.currentUser.phone
                };
                pushMessage(msg);
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // Сброс инпута
        }

        function addContact() {
            const phone = document.getElementById('new-contact-phone').value.trim();
            const name = document.getElementById('new-contact-name').value.trim();
            
            if(!phone || !name) return showToast("Заполните все поля", "error");
            if(phone === 'notes') return showToast("Зарезервированное имя", "error");
            if(state.chats[phone]) return showToast("Контакт уже существует", "error");
            
            state.chats[phone] = { name: name, messages: [] };
            saveState();
            renderChatsList();
            closeModal('add-contact-modal');
            
            document.getElementById('new-contact-phone').value = '';
            document.getElementById('new-contact-name').value = '';
            showToast("Контакт добавлен");
        }

        function toggleEditContactModal() {
            if(!state.activeChat) return;
            if(state.activeChat === 'notes') return showToast("Заметки нельзя редактировать", "error");
            
            document.getElementById('edit-contact-name-input').value = state.chats[state.activeChat].name;
            openModal('edit-contact-modal');
        }

        function saveContactEdit() {
            const newName = document.getElementById('edit-contact-name-input').value.trim();
            if(!newName) return showToast("Имя не может быть пустым", "error");
            
            state.chats[state.activeChat].name = newName;
            saveState();
            renderChatsList();
            renderActiveChat();
            closeModal('edit-contact-modal');
            showToast("Контакт обновлен");
        }

        function deleteCurrentContact() {
            if(!state.activeChat) return;
            if(state.activeChat === 'notes') return showToast("Заметки нельзя удалить", "error");
            
            if(confirm("Вы уверены, что хотите удалить этот чат?")) {
                delete state.chats[state.activeChat];
                state.activeChat = null;
                saveState();
                
                document.getElementById('chat-header').classList.add('hidden');
                document.getElementById('chat-messages').classList.add('hidden');
                document.getElementById('chat-input-panel').classList.add('hidden');
                document.getElementById('no-chat-selected').classList.remove('hidden');
                
                if (window.innerWidth <= 768) closeChatMobile();
                
                renderChatsList();
                showToast("Чат удален");
            }
        }
    </script>
</body>
</html>
