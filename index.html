<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Учитываем safe-area для современных телефонов, чтобы клавиатура и челка не перекрывали интерфейс -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Framework Messenger</title>
    
    <!-- Подключение Firebase SDK (compat версия для простоты) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-main: #f4f5f7;
            --bg-panel: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #888888;
            --accent-color: #007aff;
            --accent-hover: #005bb5;
            --msg-me: #007aff;
            --msg-them: #e5e5ea;
            --msg-text-me: #ffffff;
            --msg-text-them: #000000;
            --border-color: #e0e0e0;
            --danger: #ff3b30;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #000000;
                --bg-panel: #1c1c1e;
                --text-main: #f2f2f7;
                --text-muted: #a1a1aa;
                --accent-color: #0a84ff;
                --msg-them: #2c2c2e;
                --msg-text-them: #f2f2f7;
                --border-color: #38383a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden; /* Избегаем скролла body на мобилках */
            height: 100vh;
            height: 100dvh;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
        }
        .screen.active {
            display: flex;
        }

        /* Экран логина */
        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: var(--bg-panel);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h1 { margin-bottom: 20px; font-size: 24px; }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus { border-color: var(--accent-color); }
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active { background: var(--accent-hover); }

        .header {
            padding: 15px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: max(15px, env(safe-area-inset-top));
            z-index: 10;
        }
        .header h2 { font-size: 20px; }
        .btn-icon {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:active { background: var(--bg-main); }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .chat-item-info { flex: 1; overflow: hidden; }
        .chat-item-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .chat-item-last { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #active-chat-view {
            background: var(--bg-main);
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            /* Отступ снизу для плавающего инпута + safe area */
            padding-bottom: calc(90px + env(safe-area-inset-bottom)); 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }
        .message.me {
            align-self: flex-end;
            background: var(--msg-me);
            color: var(--msg-text-me);
            border-bottom-right-radius: 4px;
        }
        .message.them {
            align-self: flex-start;
            background: var(--msg-them);
            color: var(--msg-text-them);
            border-bottom-left-radius: 4px;
        }
        .message .time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
            display: block;
        }
        
        .message img, .message video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
        }

        .message .file-attachment {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 10px;
            margin-top: 5px;
            text-decoration: none;
            color: inherit;
        }

        .chat-input-wrapper {
            position: fixed;
            bottom: max(15px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 600px;
            z-index: 100;
        }
        .chat-input-container {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            border-radius: 30px;
            padding: 8px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
        }
        .chat-input-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            padding: 8px 10px;
            max-height: 100px;
            resize: none;
            outline: none;
            line-height: 1.3;
        }
        .chat-input-container textarea::placeholder {
            color: var(--text-muted);
        }
        
        /* Кнопки в панели ввода */
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
            flex-shrink: 0;
        }
        .action-btn:active { background: var(--bg-main); }
        .send-btn { color: var(--accent-color); }
        
        /* Модалки и Тосты */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* Утилиты */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>Вход</h1>
            <div class="input-group">
                <input type="tel" id="login-phone" placeholder="Ваш номер (например: 79991234567)" autocomplete="tel">
            </div>
            <div class="input-group">
                <input type="text" id="login-nick" placeholder="Ваше Имя" autocomplete="name">
            </div>
            <button class="btn" onclick="login()">Войти в мессенджер</button>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="header">
            <button class="btn-icon">⚙️</button>
            <h2>Чаты</h2>
            <button class="btn-icon" onclick="promptNewChat()">✏️</button>
        </div>
        <div class="chat-list" id="chats-container">
            <!-- Чаты будут рендериться здесь -->
        </div>
    </div>

    <div id="active-chat-view" class="screen">
        <div class="header">
            <button class="btn-icon" onclick="closeChat()">‹</button>
            <h2 id="chat-header-name">Имя Контакта</h2>
            <button class="btn-icon">⋮</button>
        </div>
        
        <div class="messages-container" id="messages-container">
            <!-- Сообщения -->
        </div>

        <!-- Плавающая и приподнятая панель ввода для удобства на мобильных устройствах -->
        <div class="chat-input-wrapper">
            <div class="chat-input-container">
                <!-- Объединенная кнопка вложений -->
                <button class="action-btn attach-btn" onclick="document.getElementById('file-input').click()" title="Прикрепить файл или фото">📎</button>
                <input type="file" id="file-input" class="hidden" onchange="handleFileAttachment(event)" accept="image/*, video/*, .pdf, .doc, .docx, .txt">
                
                <textarea id="message-input" rows="1" placeholder="Сообщение..." oninput="autoResize(this)" onkeypress="handleEnter(event)"></textarea>
                
                <button class="action-btn send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Уведомление</div>

    <script>
        // ВНИМАНИЕ: Замените эти данные на ваши из консоли Firebase (Project Settings -> General -> Web App)
        const firebaseConfig = {
            apiKey: "AIzaSy_YOUR_FIREBASE_API_KEY",
            authDomain: "your-app.firebaseapp.com",
            databaseURL: "https://your-app-default-rtdb.firebaseio.com",
            projectId: "your-app",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Инициализация Firebase. Обернуто в try/catch на случай неверного конфига
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            console.log("Firebase инициализирован");
        } catch (e) {
            console.error("Ошибка инициализации Firebase. Убедитесь, что конфигурация верна.", e);
        }

        // Конфигурация ИИ
        const SEEPEK_API_KEY = "sk-db8c4239a27e4798ba087173422b962d";

        // Глобальное состояние
        let state = {
            currentUser: null,
            activeChat: null,
            chats: {
                'ai': { name: 'Seepek AI 🤖', messages: [] } // ИИ всегда присутствует
            }
        };

        // Слушатели Firebase
        let currentMessagesListener = null;

        window.onload = () => {
            const savedUser = localStorage.getItem('fm_user');
            if (savedUser) {
                state.currentUser = JSON.parse(savedUser);
                showScreen('main-screen');
                initChatListListeners();
            }
        };

        function login() {
            const phone = document.getElementById('login-phone').value.trim();
            const nick = document.getElementById('login-nick').value.trim();
            if (!phone || !nick) return showToast("Заполните все поля");
            
            state.currentUser = { phone, nickname: nick };
            localStorage.setItem('fm_user', JSON.stringify(state.currentUser));
            showScreen('main-screen');
            initChatListListeners();
        }

        function initChatListListeners() {
            renderChatsList();
            
            if (!db) return; // Если Firebase не работает, остаемся в локальном режиме

            // В реальном приложении здесь был бы слушатель всех входящих сообщений
            // Для упрощения, при клике на чат мы будем загружать его историю
        }

        function promptNewChat() {
            const target = prompt("Введите номер телефона получателя:");
            if (target && target !== state.currentUser.phone) {
                if (!state.chats[target]) {
                    state.chats[target] = { name: target, messages: [] };
                    renderChatsList();
                }
                openChat(target);
            }
        }

        function renderChatsList() {
            const container = document.getElementById('chats-container');
            container.innerHTML = '';
            
            Object.keys(state.chats).forEach(phone => {
                const chat = state.chats[phone];
                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length - 1] : {text: 'Нет сообщений', time: ''};
                const displayName = phone === 'ai' ? 'Seepek AI 🤖' : (chat.name || phone);
                
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => openChat(phone);
                div.innerHTML = `
                    <div class="avatar">${displayName.charAt(0).toUpperCase()}</div>
                    <div class="chat-item-info">
                        <div class="chat-item-name">${displayName}</div>
                        <div class="chat-item-last">${lastMsg.text.startsWith('data:') ? '📎 Вложение' : lastMsg.text}</div>
                    </div>
                    <div style="font-size: 12px; color: var(--text-muted)">${lastMsg.time || ''}</div>
                `;
                container.appendChild(div);
            });
        }

        function openChat(phone) {
            state.activeChat = phone;
            document.getElementById('chat-header-name').innerText = phone === 'ai' ? 'Seepek AI 🤖' : phone;
            showScreen('active-chat-view');
            
            // Если Firebase подключен, слушаем ветку конкретного чата
            if (db) {
                listenToMessages(phone);
            } else {
                renderMessages(); // Локальный fallback
            }
        }

        function closeChat() {
            state.activeChat = null;
            showScreen('main-screen');
            renderChatsList();
            
            // Отписываемся от прослушивания при выходе из чата
            if (currentMessagesListener && db) {
                db.ref(currentMessagesListener).off();
                currentMessagesListener = null;
            }
        }

        function getChatDbPath(targetPhone) {
            // Для ИИ создаем уникальную ветку для текущего пользователя, чтобы ИИ-чаты не смешивались
            if (targetPhone === 'ai') {
                return `messages/${state.currentUser.phone}_ai`;
            }
            // Для обычных юзеров сортируем номера, чтобы ветка была общей для двоих
            const phones = [state.currentUser.phone, targetPhone].sort();
            return `messages/${phones[0]}_${phones[1]}`;
        }

        function listenToMessages(targetPhone) {
            const dbPath = getChatDbPath(targetPhone);
            
            // Отписываемся от предыдущего, если был
            if (currentMessagesListener) {
                db.ref(currentMessagesListener).off();
            }
            currentMessagesListener = dbPath;

            db.ref(dbPath).on('value', (snapshot) => {
                const data = snapshot.val();
                let loadedMessages = [];
                if (data) {
                    loadedMessages = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
                }
                
                if (!state.chats[targetPhone]) {
                    state.chats[targetPhone] = { name: targetPhone, messages: [] };
                }
                state.chats[targetPhone].messages = loadedMessages;
                
                if (state.activeChat === targetPhone) {
                    renderMessages();
                }
            });
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            const chat = state.chats[state.activeChat];
            if (!chat || !chat.messages) return;

            chat.messages.forEach(msg => {
                const isMe = msg.senderPhone === state.currentUser.phone;
                const div = document.createElement('div');
                div.className = `message ${isMe ? 'me' : 'them'}`;
                
                let contentHTML = '';
                
                // Обработка текста
                if (msg.text) {
                    contentHTML += `<div>${escapeHTML(msg.text)}</div>`;
                }

                // Обработка вложений (фото, видео, файлы)
                if (msg.attachmentUrl) {
                    if (msg.attachmentType.startsWith('image/')) {
                        contentHTML += `<img src="${msg.attachmentUrl}" alt="Фото">`;
                    } else if (msg.attachmentType.startsWith('video/')) {
                        contentHTML += `<video src="${msg.attachmentUrl}" controls></video>`;
                    } else {
                        contentHTML += `
                        <a href="${msg.attachmentUrl}" download="${msg.attachmentName}" class="file-attachment" target="_blank">
                            📄 <span>${msg.attachmentName}</span>
                        </a>`;
                    }
                }

                contentHTML += `<span class="time">${msg.time}</span>`;
                div.innerHTML = contentHTML;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendMessage(attachmentData = null) {
            if (!state.activeChat) return;
            
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text && !attachmentData) return;

            const msgData = {
                id: Date.now().toString(),
                senderPhone: state.currentUser.phone,
                senderName: state.currentUser.nickname,
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: Date.now()
            };

            if (attachmentData) {
                msgData.attachmentUrl = attachmentData.url;
                msgData.attachmentType = attachmentData.type;
                msgData.attachmentName = attachmentData.name;
            }

            input.value = '';
            input.style.height = 'auto';

            pushToDatabase(msgData, state.activeChat);

            // Если отправлено ИИ - запрашиваем ответ
            if (state.activeChat === 'ai') {
                if (attachmentData) {
                    // Пока симулируем, что ИИ реагирует на файлы текстом
                    requestSeepekResponse("Я отправил файл или фото. Опиши его или отреагируй.");
                } else {
                    requestSeepekResponse(text);
                }
            }
        }

        function pushToDatabase(msgData, targetPhone) {
            // Если Firebase не подключен - сохраняем локально
            if (!db) {
                if(!state.chats[targetPhone]) state.chats[targetPhone] = { name: targetPhone, messages: [] };
                state.chats[targetPhone].messages.push(msgData);
                if (state.activeChat === targetPhone) renderMessages();
                renderChatsList();
                return;
            }

            const dbPath = getChatDbPath(targetPhone);
            const newRef = db.ref(dbPath).push();
            newRef.set(msgData).catch(err => {
                console.error("Ошибка сохранения в Firebase", err);
                showToast("Ошибка отправки сообщения");
            });
        }

        // Запрос к DeepSeek API и сохранение ответа в Firebase!
        async function requestSeepekResponse(userText) {
            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SEEPEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "Ты — встроенный ИИ-ассистент Seepek. Отвечай кратко, вежливо и по существу." },
                            { role: "user", content: userText }
                        ],
                        stream: false
                    })
                });
                
                if (!response.ok) throw new Error("Ошибка API");
                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const aiText = data.choices[0].message.content;
                    
                    const aiMsg = {
                        id: Date.now().toString(),
                        senderPhone: 'ai',
                        senderName: 'Seepek AI',
                        text: aiText,
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        timestamp: Date.now()
                    };
                    
                    // Сохраняем ответ ИИ в Firebase точно так же, как обычное сообщение!
                    pushToDatabase(aiMsg, 'ai');
                }
            } catch (error) {
                console.error("Seepek API Error:", error);
                showToast("Seepek: Ошибка подключения к нейросети.");
                
                // Системное сообщение об ошибке локально
                const errorMsg = {
                    id: Date.now().toString(),
                    senderPhone: 'system',
                    senderName: 'System',
                    text: '⚠️ Ошибка подключения к серверу ИИ.',
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: Date.now()
                };
                pushToDatabase(errorMsg, 'ai');
            }
        }

        function handleFileAttachment(event) {
            const file = event.target.files[0];
            if (!file) return;

            // В реальном продакшене файлы загружаются в Firebase Storage.
            // Здесь, чтобы избежать необходимости настройки Storage, 
            // мы конвертируем небольшие файлы в Base64 и сохраняем прямо в Realtime DB.
            // ВАЖНО: В Firebase RTDB лимит на размер строки ~10MB, поэтому большие файлы не пройдут.
            
            if (file.size > 2 * 1024 * 1024) { // Ограничение 2МБ для Base64 демо
                showToast("Файл слишком большой для демо-режима (макс 2MB)");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                
                const attachmentData = {
                    url: base64Data,
                    type: file.type || 'application/octet-stream',
                    name: file.name
                };
                
                sendMessage(attachmentData);
            };
            
            reader.onerror = () => showToast("Ошибка чтения файла");
            reader.readAsDataURL(file);
            
            event.target.value = ''; // Сброс инпута
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
