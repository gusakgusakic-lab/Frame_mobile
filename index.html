    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getDatabase, ref, set, push, onChildAdded, onValue, get, remove, update,
            onChildChanged, onChildRemoved, query, orderByChild, limitToLast,
            onDisconnect, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Конфигурация Firebase
        const firebaseConfig = {
            databaseURL: "https://framework-5a0bf-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const STORAGE_KEY = 'framework_msg_v8';

        // Конфигурация Cloudinary (unsigned upload — эти значения публичны и безопасны во фронтенде,
        // но сам upload preset ДОЛЖЕН быть настроен на бэкенде Cloudinary с ограничением allowed_formats,
        // иначе через него можно будет залить что угодно)
        const CLOUDINARY_CLOUD_NAME = "dgrg5wra6";
        const CLOUDINARY_UPLOAD_PRESET = "my_unique_chat_preset_2026_x";
        const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
        const MAX_FILE_SIZE_BYTES = 500 * 1024 * 1024; // 500 МБ — лимит зависит от твоего тарифа Cloudinary

        // ===================== Утилиты =====================

        // Детерминированный ID комнаты для пары телефонов (не зависит от порядка)
        function getChatRoomId(phoneA, phoneB) {
            const clean = p => p.replace(/[^a-zA-Z0-9+]/g, '_');
            return [clean(phoneA), clean(phoneB)].sort().join('__');
        }

        // Хеширование пароля через Web Crypto API (SHA-256).
        // Не идеально (без соли/медленного KDF), но НАМНОГО лучше открытого текста,
        // и не требует библиотек/бекенда.
        async function hashPassword(password) {
            const enc = new TextEncoder().encode(password);
            const digest = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Готовые темы-акценты. Выбраны как самостоятельные насыщенные цвета, не переходящие
        // в градиент "как у Gemini" — это одиночные плоские HEX-цвета, каждый со своим hover-тоном.
        const THEME_PRESETS = [
            { id: 'orange',  name: 'Оранжевая',  color: '#f97316', hover: '#ea580c' },
            { id: 'blue',    name: 'Синяя',       color: '#0ea5e9', hover: '#0284c7' },
            { id: 'indigo',  name: 'Индиго',      color: '#6366f1', hover: '#4f46e5' },
            { id: 'emerald', name: 'Изумрудная',  color: '#10b981', hover: '#059669' },
            { id: 'rose',    name: 'Розовая',     color: '#f43f5e', hover: '#e11d48' },
            { id: 'amber',   name: 'Янтарная',    color: '#f59e0b', hover: '#d97706' },
            { id: 'violet',  name: 'Фиалковая',   color: '#8b5cf6', hover: '#7c3aed' },
            { id: 'teal',    name: 'Бирюзовая',   color: '#14b8a6', hover: '#0d9488' }
        ];

        // Варианты шрифта для текста сообщений
        const FONT_OPTIONS = [
            { id: 'system',   name: 'Системный',    stack: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" },
            { id: 'inter',    name: 'Inter',         stack: "'Inter', system-ui, sans-serif", googleFont: 'Inter:wght@400;500;600' },
            { id: 'roboto',   name: 'Roboto',        stack: "'Roboto', system-ui, sans-serif", googleFont: 'Roboto:wght@400;500' },
            { id: 'mono',     name: 'Моноширинный',  stack: "'JetBrains Mono', 'Courier New', monospace", googleFont: 'JetBrains+Mono:wght@400;500' },
            { id: 'serif',    name: 'С засечками',   stack: "'Merriweather', Georgia, serif", googleFont: 'Merriweather:wght@400;700' },
            { id: 'rounded',  name: 'Округлый',      stack: "'Nunito', system-ui, sans-serif", googleFont: 'Nunito:wght@400;600;700' }
        ];

        // Подгружаем Google Fonts лениво — только когда шрифт реально выбран,
        // чтобы не тянуть лишний трафик при системном шрифте по умолчанию
        let loadedGoogleFonts = new Set();
        function ensureGoogleFontLoaded(fontOption) {
            if (!fontOption.googleFont || loadedGoogleFonts.has(fontOption.id)) return;
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `https://fonts.googleapis.com/css2?family=${fontOption.googleFont}&display=swap`;
            document.head.appendChild(link);
            loadedGoogleFonts.add(fontOption.id);
        }

        // Глобальное состояние
        let state = {
            currentUser: null,
            chats: {},           // phone -> { name, messages: [] }
            activeChat: null,
            accentColor: '#f97316',    // Акцентный цвет интерфейса (HEX)
            messageFont: 'system',     // Ключ шрифта сообщений, см. FONT_OPTIONS
            userAvatars: {},     // Кэш аватарок пользователей
            contacts: {},        // Синхронизированные контакты
            presence: {}         // phone -> { online: bool, lastSeen: number }
        };

        // Состояния действий с сообщениями
        let actionState = {
            type: null, // 'reply', 'edit', 'forward'
            messageId: null,
            messageText: null
        };

        // Переменные для долгого нажатия (Контекстное меню)
        let pressTimer = null;
        let selectedMsgId = null;
        let selectedMsgEl = null;

        // Активные слушатели сообщений/присутствия/печати по комнатам, чтобы не плодить дубли
        let activeMessageListeners = {}; // roomId -> true
        let activePresenceListeners = {}; // phone -> true
        let typingTimeout = null;
        let lastTypingSentAt = 0;

        // --- Состояние глобального музыкального плеера ---
        // Плейлист = все аудио-сообщения ТЕКУЩЕГО открытого чата, в порядке появления.
        let playerState = {
            playlist: [],       // [{id, filename, dataUrl}]
            currentIndex: -1,
            isPlaying: false
        };
        const globalAudioEl = () => document.getElementById('global-audio-player');

        window.onload = initApp;

        function initApp() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    state.currentUser = parsed.currentUser || null;
                    state.chats = parsed.chats || {};
                    state.activeChat = parsed.activeChat || null;
                    // Миграция со старой версии (слайдер оранжевый->зелёный) на HEX-акцент
                    if (parsed.accentColor) {
                        state.accentColor = parsed.accentColor;
                    } else if (typeof parsed.themeSliderValue === 'number') {
                        const hue = 25 + ((140 - 25) * (parsed.themeSliderValue / 100));
                        state.accentColor = hslToHex(hue, 90, 50);
                    }
                    state.messageFont = parsed.messageFont || 'system';
                    state.userAvatars = parsed.userAvatars || {};
                    state.contacts = parsed.contacts || {};
                    state.presence = parsed.presence || {};
                } catch(e) { console.error("Parse error", e); }
            }

            applyAccentColor(state.accentColor);
            applyMessageFont(state.messageFont);
            renderThemePresets();
            renderFontOptions();
            setupGlobalAudioListeners();

            // Экспорт функций в global window для HTML onclick
            Object.assign(window, {
                showAuthForm, hideAuthForm, submitAuth, logout,
                openFriendsModal, closeModal, submitAddFriend,
                toggleEditContactModal, saveContactChanges, deleteCurrentContact,
                openMyProfileModal, saveMyProfileChanges,
                switchSettingsTab, applyCustomThemeColor, applyCustomThemeColorFromHex, selectThemePreset, selectFontOption,
                submitMessage, handleFileUpload, selectChat, backToChats,
                autoResizeInput, cancelMessageAction, ctxAction,
                handleMsgPointerDown, handleMsgPointerUp, handleMsgPointerMove, downloadRemoteFile,
                handleAvatarUpload, handleTypingInput, renderChatsList,
                playerTogglePlay, playerNext, playerPrev, playAudioMessage, seekPlayer, closePlayer,
                toggleVolumePopup, setPlayerVolume
            });

            // Закрытие контекстного меню при клике вне
            document.addEventListener('click', (e) => {
                if(!e.target.closest('#context-menu') && !e.target.closest('.message-bubble')) {
                    hideContextMenu();
                }
            });

            // Уходим оффлайн при закрытии вкладки (лучшее, что можно сделать синхронно)
            window.addEventListener('beforeunload', () => {
                if (state.currentUser) {
                    // onDisconnect уже настроен ниже, это просто подчистка "печатает"
                    set(ref(db, `typing/${state.currentUser.phone}`), null);
                }
            });

            if (state.currentUser) {
                showMainScreen();
                syncContactsFromFirebase();
                syncUserAvatars();
                setupPresence();
                Object.keys(state.chats).forEach(phone => {
                    listenToRoomMessages(phone);
                    listenToPresence(phone);
                });
                if (state.activeChat) {
                    markChatAsRead(state.activeChat);
                    listenToTyping(state.activeChat);
                }
            } else {
                showAuthScreen();
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // --- ТЕМА (акцентный цвет) ---

        // hue [0-360], sat/light [0-100] -> "#rrggbb". Нужно только для миграции старого слайдера.
        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
            return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
        }

        // Затемняет HEX-цвет на заданный процент — используется для автоматического hover-тона
        // у произвольного (не пресетного) цвета из color picker.
        function darkenHex(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            let r = (num >> 16) - Math.round(255 * percent);
            let g = ((num >> 8) & 0x00FF) - Math.round(255 * percent);
            let b = (num & 0x0000FF) - Math.round(255 * percent);
            r = Math.max(0, r); g = Math.max(0, g); b = Math.max(0, b);
            return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
        }

        function applyAccentColor(hex, hoverHex) {
            state.accentColor = hex;
            document.documentElement.style.setProperty('--theme-color', hex);
            document.documentElement.style.setProperty('--theme-hover', hoverHex || darkenHex(hex, 0.12));
            saveState();
        }

        function applyCustomThemeColor(hex) {
            applyAccentColor(hex);
            document.getElementById('custom-theme-hex-input').value = hex;
            renderThemePresets(); // снимаем подсветку с пресетов, если был выбран свой цвет
        }

        function applyCustomThemeColorFromHex(value) {
            const hex = value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
                document.getElementById('custom-theme-color-picker').value = hex;
                applyAccentColor(hex);
                renderThemePresets();
            }
        }

        function selectThemePreset(presetId) {
            const preset = THEME_PRESETS.find(p => p.id === presetId);
            if (!preset) return;
            applyAccentColor(preset.color, preset.hover);
            document.getElementById('custom-theme-color-picker').value = preset.color;
            document.getElementById('custom-theme-hex-input').value = preset.color;
            renderThemePresets();
        }

        function renderThemePresets() {
            const row = document.getElementById('theme-presets-row');
            if (!row) return;
            row.innerHTML = THEME_PRESETS.map(preset => {
                const isActive = state.accentColor.toLowerCase() === preset.color.toLowerCase();
                return `
                    <button onclick="selectThemePreset('${preset.id}')"
                            class="group flex flex-col items-center space-y-1.5 focus:outline-none"
                            title="${preset.name}">
                        <span class="w-10 h-10 rounded-full block transition-transform group-active:scale-90 ${isActive ? 'ring-2 ring-offset-2 ring-offset-black ring-white' : ''}"
                              style="background-color: ${preset.color};"></span>
                        <span class="text-[10px] font-bold ${isActive ? 'text-white' : 'text-neutral-500'} whitespace-nowrap">${preset.name}</span>
                    </button>
                `;
            }).join('');
        }

        // --- ШРИФТ СООБЩЕНИЙ ---
        function applyMessageFont(fontId) {
            const font = FONT_OPTIONS.find(f => f.id === fontId) || FONT_OPTIONS[0];
            state.messageFont = font.id;
            ensureGoogleFontLoaded(font);
            document.documentElement.style.setProperty('--msg-font', font.stack);
            saveState();
        }

        function selectFontOption(fontId) {
            applyMessageFont(fontId);
            renderFontOptions();
        }

        function renderFontOptions() {
            const list = document.getElementById('font-options-list');
            if (!list) return;
            list.innerHTML = FONT_OPTIONS.map(font => {
                const isActive = state.messageFont === font.id;
                return `
                    <button onclick="selectFontOption('${font.id}')"
                            class="w-full flex items-center justify-between p-3 rounded-xl border transition text-left ${isActive ? 'border-theme bg-theme/10' : 'border-neutral-800 hover:border-neutral-700'}">
                        <span style="font-family: ${font.stack};" class="text-white text-sm">${font.name} — Пример текста Аа</span>
                        ${isActive ? '<span class="text-theme text-lg shrink-0 ml-2">✓</span>' : ''}
                    </button>
                `;
            }).join('');
        }

        // --- ТАБЫ НАСТРОЕК ---
        function switchSettingsTab(tab) {
            const tabAccount = document.getElementById('settings-tab-account');
            const tabPersonalization = document.getElementById('settings-tab-personalization');
            const panelAccount = document.getElementById('settings-panel-account');
            const panelPersonalization = document.getElementById('settings-panel-personalization');

            if (tab === 'account') {
                tabAccount.classList.add('active');
                tabPersonalization.classList.remove('active');
                panelAccount.classList.remove('hidden');
                panelPersonalization.classList.add('hidden');
            } else {
                tabPersonalization.classList.add('active');
                tabAccount.classList.remove('active');
                panelPersonalization.classList.remove('hidden');
                panelAccount.classList.add('hidden');
            }
        }

        // --- УВЕДОМЛЕНИЯ ---
        function showToast(text, type = "success") {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : 'bg-theme';
            const textColor = type === 'error' ? 'text-white' : 'text-black';
            el.className = `${bgColor} ${textColor} px-5 py-2.5 rounded-full font-bold text-sm shadow-xl fade-in transition-opacity duration-300 transform translate-y-0`;
            el.innerText = text;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-10px)';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // --- АВТОРИЗАЦИЯ ---
        let currentAuthMode = 'login';

        function showAuthScreen() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
            hideAuthForm();
        }

        function showAuthForm(mode) {
            currentAuthMode = mode;
            document.getElementById('auth-buttons-group').classList.add('hidden');
            document.getElementById('auth-form').classList.remove('hidden');

            const nick = document.getElementById('nickname-field-container');
            const user = document.getElementById('username-field-container');
            if (mode === 'register') {
                document.getElementById('form-title').innerText = 'Регистрация';
                nick.classList.remove('hidden');
                user.classList.remove('hidden');
            } else {
                document.getElementById('form-title').innerText = 'Вход';
                nick.classList.add('hidden');
                user.classList.add('hidden');
            }
        }

        function hideAuthForm() {
            document.getElementById('auth-buttons-group').classList.remove('hidden');
            document.getElementById('auth-form').classList.add('hidden');
        }

        async function submitAuth() {
            const phone = document.getElementById('auth-phone').value.trim().replace(/[^0-9+]/g, '');
            const pass = document.getElementById('auth-password').value.trim();
            const nick = document.getElementById('auth-nickname').value.trim();

            if (!phone || !pass) return showToast("Введите телефон и пароль", "error");

            const passwordHash = await hashPassword(pass);

            if (currentAuthMode === 'register') {
                if (!nick) return showToast("Введите никнейм", "error");

                // Проверяем, не занят ли номер
                const existingSnap = await get(ref(db, 'users/' + phone));
                if (existingSnap.exists()) {
                    return showToast("Этот номер уже зарегистрирован", "error");
                }

                state.currentUser = {
                    phone,
                    nickname: nick,
                    passwordHash,
                    ringColor: "#22c55e",
                    avatar: null,
                    contacts: {}
                };
                await set(ref(db, 'users/' + phone), state.currentUser);

                state.userAvatars[phone] = null;

                showToast("Регистрация успешна!");
                saveState();
                await finishLogin();
            } else {
                try {
                    const snap = await get(ref(db, 'users/' + phone));
                    if (!snap.exists()) {
                        return showToast("Неверный логин или пароль", "error");
                    }
                    const userData = snap.val();

                    // Поддержка миграции со старых аккаунтов (открытый пароль -> хеш)
                    let passwordOk = false;
                    if (userData.passwordHash) {
                        passwordOk = userData.passwordHash === passwordHash;
                    } else if (userData.password) {
                        // Старый аккаунт с открытым паролем — сверяем и мигрируем на лету
                        passwordOk = userData.password === pass;
                        if (passwordOk) {
                            await update(ref(db, 'users/' + phone), { passwordHash, password: null });
                            userData.passwordHash = passwordHash;
                            delete userData.password;
                        }
                    }

                    if (!passwordOk) {
                        return showToast("Неверный логин или пароль", "error");
                    }

                    state.currentUser = userData;
                    if (state.currentUser.avatar) {
                        state.userAvatars[phone] = state.currentUser.avatar;
                    }

                    showToast("Вход выполнен");
                    saveState();
                    await finishLogin();
                } catch (e) {
                    showToast("Ошибка сети", "error");
                }
            }
        }

        async function finishLogin() {
            showMainScreen();
            syncContactsFromFirebase();
            syncUserAvatars();
            setupPresence();
            Object.keys(state.chats).forEach(phone => {
                listenToRoomMessages(phone);
                listenToPresence(phone);
            });
        }

        function logout() {
            teardownPresence();
            // Отписка от всех слушателей комнат/присутствия/печати не делаем явно (страница перезагрузит контекст),
            // но помечаем оффлайн перед выходом.
            state.currentUser = null;
            state.activeChat = null;
            activeMessageListeners = {};
            activePresenceListeners = {};
            saveState();
            closeModal('my-profile-modal');
            showAuthScreen();
        }

        // --- ПРИСУТСТВИЕ (ОНЛАЙН/ОФФЛАЙН) ---
        function setupPresence() {
            if (!state.currentUser) return;
            const myPresenceRef = ref(db, 'presence/' + state.currentUser.phone);

            // Как только соединение с Firebase установлено — ставим онлайн,
            // и настраиваем, что при разрыве соединения (закрытие вкладки, потеря сети) сервер сам проставит оффлайн.
            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    onDisconnect(myPresenceRef).set({ online: false, lastSeen: Date.now() });
                    set(myPresenceRef, { online: true, lastSeen: Date.now() });
                }
            });
        }

        function teardownPresence() {
            if (!state.currentUser) return;
            set(ref(db, 'presence/' + state.currentUser.phone), { online: false, lastSeen: Date.now() }).catch(()=>{});
        }

        function listenToPresence(phone) {
            if (activePresenceListeners[phone]) return;
            activePresenceListeners[phone] = true;

            onValue(ref(db, 'presence/' + phone), (snap) => {
                const val = snap.val() || { online: false, lastSeen: null };
                state.presence[phone] = val;
                saveState();
                renderChatsList();
                if (state.activeChat === phone) {
                    updateActiveChatOnlineDot();
                }
            });
        }

        function updateActiveChatOnlineDot() {
            const dot = document.getElementById('active-chat-online-dot');
            if (!state.activeChat) { dot.classList.add('hidden'); return; }
            const p = state.presence[state.activeChat];
            dot.classList.remove('hidden');
            if (p && p.online) {
                dot.classList.remove('offline');
            } else {
                dot.classList.add('offline');
            }
        }

        // --- ИНДИКАТОР "ПЕЧАТАЕТ..." ---
        function handleTypingInput() {
            if (!state.activeChat || !state.currentUser) return;
            const now = Date.now();
            // Не спамим базу — обновляем статус "печатает" не чаще раза в 2 сек
            if (now - lastTypingSentAt > 2000) {
                lastTypingSentAt = now;
                const roomId = getChatRoomId(state.currentUser.phone, state.activeChat);
                set(ref(db, `typing/${roomId}/${state.currentUser.phone}`), true);
            }
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                if (!state.activeChat || !state.currentUser) return;
                const roomId = getChatRoomId(state.currentUser.phone, state.activeChat);
                set(ref(db, `typing/${roomId}/${state.currentUser.phone}`), null);
            }, 2500);
        }

        let typingListenerRoom = null;
        function listenToTyping(otherPhone) {
            if (!state.currentUser || !otherPhone) return;
            const roomId = getChatRoomId(state.currentUser.phone, otherPhone);
            typingListenerRoom = roomId;

            onValue(ref(db, `typing/${roomId}/${otherPhone}`), (snap) => {
                // Игнорируем события для чата, который уже не активен
                if (typingListenerRoom !== roomId || state.activeChat !== otherPhone) return;
                const indicator = document.getElementById('typing-indicator');
                if (snap.val() === true) {
                    indicator.classList.remove('hidden');
                    const container = document.getElementById('messages-container');
                    container.scrollTop = container.scrollHeight;
                } else {
                    indicator.classList.add('hidden');
                }
            });
        }

        // --- СИНХРОНИЗАЦИЯ КОНТАКТОВ И АВАТАРОК ---
        function syncContactsFromFirebase() {
            if(!state.currentUser) return;

            const contactsRef = ref(db, 'users/' + state.currentUser.phone + '/contacts');

            onChildAdded(contactsRef, (snap) => {
                const contactPhone = snap.key;
                const contactData = snap.val();

                if (contactPhone !== state.currentUser.phone) {
                    if (!state.chats[contactPhone]) {
                        state.chats[contactPhone] = {
                            name: contactData.name || contactPhone,
                            messages: []
                        };
                    } else {
                        state.chats[contactPhone].name = contactData.name || state.chats[contactPhone].name;
                    }

                    state.contacts[contactPhone] = contactData;
                    saveState();
                    renderChatsList();

                    loadUserAvatar(contactPhone);
                    listenToRoomMessages(contactPhone);
                    listenToPresence(contactPhone);
                }
            });

            onChildChanged(contactsRef, (snap) => {
                const contactPhone = snap.key;
                const contactData = snap.val();

                if (state.chats[contactPhone]) {
                    state.chats[contactPhone].name = contactData.name || state.chats[contactPhone].name;
                    state.contacts[contactPhone] = contactData;
                    saveState();
                    renderChatsList();
                }
            });

            onChildRemoved(contactsRef, (snap) => {
                const contactPhone = snap.key;

                if (state.chats[contactPhone]) {
                    delete state.chats[contactPhone];
                    delete state.contacts[contactPhone];
                    delete state.userAvatars[contactPhone];
                    delete activeMessageListeners[contactPhone];
                    delete activePresenceListeners[contactPhone];

                    if (state.activeChat === contactPhone) {
                        state.activeChat = null;
                        renderActiveChat();
                    }

                    saveState();
                    renderChatsList();
                }
            });
        }

        function syncUserAvatars() {
            if(!state.currentUser) return;

            const myUserRef = ref(db, 'users/' + state.currentUser.phone);
            onValue(myUserRef, (snap) => {
                if (snap.exists()) {
                    const userData = snap.val();
                    if (userData.avatar !== state.currentUser.avatar) {
                        state.currentUser.avatar = userData.avatar;
                        state.userAvatars[state.currentUser.phone] = userData.avatar;
                        saveState();
                        updateProfileUI();
                    }
                }
            });

            Object.keys(state.chats).forEach(phone => {
                loadUserAvatar(phone);
            });
        }

        function loadUserAvatar(phone) {
            get(ref(db, 'users/' + phone)).then((userSnap) => {
                if (userSnap.exists()) {
                    const userData = userSnap.val();
                    if (userData.avatar) {
                        state.userAvatars[phone] = userData.avatar;
                    }
                    saveState();
                    renderChatsList();
                    if(state.activeChat === phone) renderActiveChat();
                }
            }).catch(() => {});
        }

        // --- СИНХРОНИЗАЦИЯ СООБЩЕНИЙ (постоянное хранилище по комнатам) ---
        // Сообщения хранятся по адресу messages/{roomId}/{pushId} и НЕ удаляются после доставки.
        // roomId детерминирован по паре телефонов, поэтому оба участника слушают одно и то же место.
        function listenToRoomMessages(otherPhone) {
            if (activeMessageListeners[otherPhone]) return;
            activeMessageListeners[otherPhone] = true;

            const myPhone = state.currentUser.phone;
            const roomId = getChatRoomId(myPhone, otherPhone);
            const roomRef = ref(db, 'messages/' + roomId);

            onChildAdded(roomRef, (snap) => {
                const messageData = snap.val();
                if (!messageData) return;

                const chat = state.chats[otherPhone];
                if (!chat) return; // контакт мог быть удалён

                const messageId = messageData.id || snap.key;
                const isMine = messageData.senderPhone === myPhone;

                let existing = chat.messages.find(m => m.id === messageId);
                if (!existing) {
                    existing = {
                        id: messageId,
                        dbKey: snap.key,
                        type: messageData.type || 'text',
                        text: messageData.text,
                        dataUrl: messageData.dataUrl,
                        filename: messageData.filename,
                        replyToText: messageData.replyToText,
                        isForwarded: messageData.isForwarded,
                        isEdited: messageData.isEdited,
                        isDeleted: messageData.isDeleted || false,
                        sender: isMine ? 'me' : 'them',
                        senderPhone: messageData.senderPhone,
                        time: messageData.time,
                        status: messageData.status || 'sent' // sent -> delivered -> read
                    };
                    chat.messages.push(existing);
                } else {
                    existing.dbKey = snap.key;
                }

                saveState();
                renderChatsList();
                if (state.activeChat === otherPhone) {
                    renderActiveChat();
                }

                if (state.activeChat !== otherPhone && !isMine) {
                    showToast(`Новое сообщение от ${chat.name}`, "success");
                }

                // Если это сообщение адресовано мне (я его получил) — помечаем как доставленное
                if (!isMine && messageData.status === 'sent') {
                    update(ref(db, `messages/${roomId}/${snap.key}`), { status: 'delivered' });
                }
                // Если чат открыт прямо сейчас — сразу помечаем прочитанным
                if (!isMine && state.activeChat === otherPhone) {
                    update(ref(db, `messages/${roomId}/${snap.key}`), { status: 'read' });
                }
            });

            onChildChanged(roomRef, (snap) => {
                const messageData = snap.val();
                if (!messageData) return;
                const chat = state.chats[otherPhone];
                if (!chat) return;

                const existingMsg = chat.messages.find(m => m.id === messageData.id);
                if (existingMsg) {
                    existingMsg.text = messageData.text;
                    existingMsg.isEdited = messageData.isEdited;
                    existingMsg.isDeleted = messageData.isDeleted || false;
                    existingMsg.type = messageData.type || existingMsg.type;
                    existingMsg.dataUrl = messageData.dataUrl || existingMsg.dataUrl;
                    existingMsg.filename = messageData.filename || existingMsg.filename;
                    existingMsg.status = messageData.status || existingMsg.status;

                    saveState();
                    renderChatsList();
                    if (state.activeChat === otherPhone) renderActiveChat();
                }
            });
        }

        // Помечает все непрочитанные входящие сообщения в чате как прочитанные
        function markChatAsRead(otherPhone) {
            if (!state.currentUser || !otherPhone) return;
            const chat = state.chats[otherPhone];
            if (!chat) return;
            const roomId = getChatRoomId(state.currentUser.phone, otherPhone);

            chat.messages.forEach(msg => {
                if (msg.sender === 'them' && msg.status !== 'read' && msg.dbKey) {
                    msg.status = 'read';
                    update(ref(db, `messages/${roomId}/${msg.dbKey}`), { status: 'read' }).catch(()=>{});
                }
            });
            saveState();
        }

        // --- ГЛАВНЫЙ ЭКРАН И ЧАТЫ ---
        function showMainScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('flex');

            updateProfileUI();
            renderChatsList();

            if(window.innerWidth < 768 && state.activeChat) {
                selectChat(state.activeChat);
            } else {
                renderActiveChat();
            }
        }

        function updateProfileUI() {
            if(!state.currentUser) return;
            document.getElementById('my-nickname').innerText = state.currentUser.nickname || 'User';
            document.documentElement.style.setProperty('--user-ring', state.currentUser.ringColor || '#22c55e');

            const avatarWrapper = document.getElementById('my-avatar-wrapper');
            if (state.currentUser.avatar && state.currentUser.avatar.startsWith('data:image')) {
                avatarWrapper.innerHTML = `<img src="${state.currentUser.avatar}" class="w-full h-full object-cover rounded-full">`;
            } else {
                avatarWrapper.innerHTML = `<span id="my-avatar" class="text-lg">🦆</span>`;
            }
        }

        // --- МОБИЛЬНАЯ АДАПТИВНОСТЬ МЕНЮ ---
        function selectChat(phone) {
            state.activeChat = phone;
            saveState();
            renderChatsList();
            renderActiveChat();
            markChatAsRead(phone);
            listenToTyping(phone);
            updateActiveChatOnlineDot();

            const sidebar = document.getElementById('chat-sidebar');
            const chatWin = document.getElementById('chat-window');
            if(window.innerWidth < 768) {
                sidebar.classList.add('hidden');
                chatWin.classList.remove('hidden');
                chatWin.classList.add('flex');
            }
        }

        function backToChats() {
            const sidebar = document.getElementById('chat-sidebar');
            const chatWin = document.getElementById('chat-window');

            sidebar.classList.remove('hidden');
            sidebar.classList.add('flex');
            chatWin.classList.add('hidden');
            chatWin.classList.remove('flex');
        }

        function renderChatsList() {
            const list = document.getElementById('chats-list');
            const searchInput = document.getElementById('chat-search-input');
            const searchTerm = (searchInput ? searchInput.value : '').trim().toLowerCase();
            list.innerHTML = '';

            let keys = Object.keys(state.chats);
            if (searchTerm) {
                keys = keys.filter(phone => {
                    const chat = state.chats[phone];
                    return chat.name.toLowerCase().includes(searchTerm) || phone.includes(searchTerm);
                });
            }

            if(keys.length === 0) {
                list.innerHTML = `<div class="text-neutral-500 text-sm p-4 text-center">${searchTerm ? 'Ничего не найдено' : 'Нет чатов. Добавьте контакт!'}</div>`;
                return;
            }

            keys.forEach(phone => {
                const chat = state.chats[phone];
                const msgs = (chat.messages || []).filter(m => !m.isDeleted);
                const last = msgs[msgs.length - 1];
                let lastTxt = "Нет сообщений";
                if(last) {
                    if(last.type === 'image') lastTxt = "📷 Фотография";
                    else if(last.type === 'audio') lastTxt = "🎵 Аудио";
                    else if(last.type === 'file') lastTxt = "📄 Файл";
                    else lastTxt = last.text || "";
                }

                const unreadCount = msgs.filter(m => m.sender === 'them' && m.status !== 'read').length;

                const isActive = state.activeChat === phone;
                const bgClass = isActive ? 'bg-theme text-black shadow-lg' : 'hover:bg-neutral-800 text-white';
                const textMuted = isActive ? 'text-black/70' : 'text-neutral-500';

                const userAvatar = state.userAvatars[phone];
                const avatarContent = userAvatar && userAvatar.startsWith('data:image')
                    ? `<img src="${userAvatar}" class="w-full h-full object-cover rounded-full">`
                    : '👤';

                const presence = state.presence[phone];
                const isOnline = presence && presence.online;
                const onlineDotHtml = `<span class="online-dot ${isOnline ? '' : 'offline'}"></span>`;

                // Статус-иконка для последнего сообщения, если оно моё
                let statusIcon = '';
                if (last && last.sender === 'me') {
                    if (last.status === 'read') statusIcon = `<span class="text-blue-400">✓✓</span> `;
                    else if (last.status === 'delivered') statusIcon = `<span class="${isActive ? 'text-black/60' : 'text-neutral-400'}">✓✓</span> `;
                    else statusIcon = `<span class="${isActive ? 'text-black/60' : 'text-neutral-400'}">✓</span> `;
                }

                const el = document.createElement('div');
                el.className = `p-3 rounded-2xl cursor-pointer transition-all flex items-center space-x-3 mb-1 ${bgClass}`;
                el.onclick = () => selectChat(phone);
                el.innerHTML = `
                    <div class="relative w-12 h-12 shrink-0">
                        <div class="w-12 h-12 rounded-full ${isActive?'bg-black/20':'bg-neutral-800'} flex items-center justify-center text-xl overflow-hidden">${avatarContent}</div>
                        ${onlineDotHtml}
                    </div>
                    <div class="overflow-hidden flex-1">
                        <h4 class="font-bold text-sm truncate">${chat.name}</h4>
                        <p class="text-xs truncate ${textMuted} flex items-center">${statusIcon}${escapeHtml(lastTxt)}</p>
                    </div>
                    ${unreadCount > 0 ? `<span class="shrink-0 min-w-[20px] h-5 px-1.5 rounded-full ${isActive ? 'bg-black/30 text-black' : 'bg-theme text-black'} text-xs font-bold flex items-center justify-center">${unreadCount}</span>` : ''}
                `;
                list.appendChild(el);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        // --- КОНТЕКСТНОЕ МЕНЮ (LONG PRESS 3 СЕК) ---
        function handleMsgPointerDown(e, msgId) {
            if(e.type === 'mousedown' && e.button !== 0) return;

            selectedMsgId = msgId;
            selectedMsgEl = e.currentTarget;

            pressTimer = setTimeout(() => {
                showContextMenu(e, msgId);
                pressTimer = null;
            }, 3000);
        }

        function handleMsgPointerUp() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        function handleMsgPointerMove() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        function showContextMenu(e, msgId) {
            e.preventDefault();
            const menu = document.getElementById('context-menu');

            const chat = state.chats[state.activeChat];
            const msg = chat.messages.find(m => m.id === msgId);

            if(!msg || msg.isDeleted) return;

            const editBtn = document.getElementById('ctx-edit-btn');
            if(msg.sender === 'me' && msg.type === 'text') {
                editBtn.classList.remove('hidden');
                editBtn.classList.add('flex');
            } else {
                editBtn.classList.add('hidden');
                editBtn.classList.remove('flex');
            }

            menu.classList.remove('hidden');
            setTimeout(() => {
                menu.classList.remove('scale-95', 'opacity-0');
                menu.classList.add('scale-100', 'opacity-100');
            }, 10);

            let x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            const menuWidth = 192;
            const menuHeight = menu.offsetHeight || 200;

            if (x + menuWidth > window.innerWidth) x = window.innerWidth - menuWidth - 10;
            if (y + menuHeight > window.innerHeight) y = window.innerHeight - menuHeight - 10;

            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
        }

        function hideContextMenu() {
            const menu = document.getElementById('context-menu');
            menu.classList.remove('scale-100', 'opacity-100');
            menu.classList.add('scale-95', 'opacity-0');
            setTimeout(() => menu.classList.add('hidden'), 200);
        }

        // --- ДЕЙСТВИЯ С СООБЩЕНИЯМИ ---
        function ctxAction(type) {
            hideContextMenu();
            if(!selectedMsgId || !state.activeChat) return;

            const chat = state.chats[state.activeChat];
            const msg = chat.messages.find(m => m.id === selectedMsgId);
            if(!msg) return;

            const roomId = getChatRoomId(state.currentUser.phone, state.activeChat);

            if(type === 'delete') {
                msg.isDeleted = true;
                msg.text = "";
                msg.dataUrl = "";

                showToast("Сообщение удалено");
                saveState();
                renderActiveChat();
                renderChatsList();

                // Помечаем удалённым прямо в постоянной записи (не создаём новую запись,
                // это оставляет историю честной — сообщение остаётся "удалено" для обеих сторон)
                if (msg.dbKey) {
                    update(ref(db, `messages/${roomId}/${msg.dbKey}`), {
                        isDeleted: true,
                        text: "",
                        dataUrl: ""
                    });
                }
            }
            else if (type === 'edit') {
                actionState = { type: 'edit', messageId: msg.id, messageText: msg.text };
                document.getElementById('action-banner').classList.remove('hidden');
                document.getElementById('action-banner-title').innerText = "Редактирование";
                document.getElementById('action-banner-text').innerText = msg.text;

                const input = document.getElementById('message-input');
                input.value = msg.text;
                input.focus();
                autoResizeInput();
            }
            else if (type === 'reply') {
                actionState = { type: 'reply', messageId: msg.id, messageText: msg.text || (msg.type === 'image' ? 'Фото' : 'Файл') };
                document.getElementById('action-banner').classList.remove('hidden');
                document.getElementById('action-banner-title').innerText = "Ответ";
                document.getElementById('action-banner-text').innerText = actionState.messageText;
                document.getElementById('message-input').focus();
            }
            else if (type === 'forward') {
                actionState = { type: 'forward', messageId: msg.id, messageData: msg };
                openForwardModal();
            }
        }

        function cancelMessageAction() {
            actionState = { type: null, messageId: null, messageText: null };
            document.getElementById('action-banner').classList.add('hidden');
            const input = document.getElementById('message-input');
            input.value = "";
            autoResizeInput();
        }

        function openForwardModal() {
            const modal = document.getElementById('forward-modal');
            const list = document.getElementById('forward-chats-list');
            list.innerHTML = '';

            Object.keys(state.chats).forEach(phone => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 hover:bg-neutral-800 text-white rounded-lg border-b border-neutral-800 last:border-0";
                btn.innerText = state.chats[phone].name;
                btn.onclick = () => {
                    executeForward(phone);
                    closeModal('forward-modal');
                };
                list.appendChild(btn);
            });
            modal.classList.remove('hidden');
        }

        function executeForward(targetPhone) {
            if(!actionState.messageData) return;
            const originalMsg = actionState.messageData;

            pushMessageToStateAndDb({
                type: originalMsg.type,
                text: originalMsg.text,
                dataUrl: originalMsg.dataUrl,
                filename: originalMsg.filename,
                isForwarded: true
            }, targetPhone);

            showToast("Сообщение переслано");
            cancelMessageAction();
        }

        // --- ОТРИСОВКА АКТИВНОГО ЧАТА ---
        function renderActiveChat() {
            const noChat = document.getElementById('no-chat-selected');
            const container = document.getElementById('messages-container');
            const headerName = document.getElementById('active-chat-name');
            const headerPhone = document.getElementById('active-chat-phone');
            const headerAvatar = document.getElementById('active-chat-avatar');

            if(!state.activeChat) {
                noChat.classList.remove('hidden');
                container.innerHTML = '';
                document.getElementById('active-chat-online-dot').classList.add('hidden');
                return;
            }
            noChat.classList.add('hidden');

            const chat = state.chats[state.activeChat];
            headerName.innerText = chat.name;
            headerPhone.innerText = state.activeChat;
            updateActiveChatOnlineDot();

            const userAvatar = state.userAvatars[state.activeChat];
            if (userAvatar && userAvatar.startsWith('data:image')) {
                headerAvatar.innerHTML = `<img src="${userAvatar}" class="w-full h-full object-cover">`;
            } else {
                headerAvatar.innerHTML = '👤';
            }

            container.innerHTML = '';

            chat.messages.forEach(msg => {
                const wrapper = document.createElement('div');
                const isMe = msg.sender === 'me';
                wrapper.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'} fade-in message-bubble no-select`;

                if (msg.isDeleted) {
                    wrapper.innerHTML = `
                        <div class="max-w-[85%] sm:max-w-[70%] rounded-2xl p-3 bg-neutral-900 border border-neutral-800 text-neutral-500 italic text-sm">
                            🚫 Сообщение удалено
                        </div>`;
                    container.appendChild(wrapper);
                    return;
                }

                wrapper.onmousedown = (e) => handleMsgPointerDown(e, msg.id);
                wrapper.onmouseup = handleMsgPointerUp;
                wrapper.onmouseleave = handleMsgPointerUp;
                wrapper.ontouchstart = (e) => handleMsgPointerDown(e, msg.id);
                wrapper.ontouchend = handleMsgPointerUp;
                wrapper.ontouchmove = handleMsgPointerMove;
                wrapper.oncontextmenu = (e) => e.preventDefault();

                let content = '';

                if(msg.replyToText) {
                    content += `<div class="bg-black/20 border-l-2 border-theme p-2 mb-2 rounded text-xs opacity-80"><span class="text-theme font-bold">Ответ на:</span> ${escapeHtml(msg.replyToText)}</div>`;
                }
                if(msg.isForwarded) {
                    content += `<div class="text-[10px] text-neutral-400 mb-1 font-bold uppercase">➡️ Пересланное сообщение</div>`;
                }

                if(msg.type === 'image') {
                    content += `
                        <div class="relative group">
                            <img src="${msg.dataUrl}" class="max-w-[200px] sm:max-w-xs rounded-lg shadow-sm block" />
                            <button onclick="downloadRemoteFile('${msg.dataUrl}', '${escapeHtml(msg.filename || 'photo.jpg')}')"
                                    class="absolute bottom-2 right-2 w-8 h-8 bg-black/60 hover:bg-black/80 rounded-full flex items-center justify-center text-white transition backdrop-blur-sm"
                                    title="Скачать фото">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            </button>
                        </div>`;
                } else if (msg.type === 'audio') {
                    content += `
                        <div class="flex items-center space-x-3 min-w-[220px] cursor-pointer group" onclick="playAudioMessage('${msg.id}')">
                            <div class="w-10 h-10 rounded-full ${isMe ? 'bg-black/20' : 'bg-theme'} flex items-center justify-center shrink-0 transition group-active:scale-90">
                                <svg class="w-4 h-4 ${isMe ? 'text-black' : 'text-black'} audio-msg-play-icon" data-msg-id="${msg.id}" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                            </div>
                            <div class="flex flex-col min-w-0 flex-1">
                                <span class="text-xs font-bold truncate">${escapeHtml(msg.filename || 'Аудио')}</span>
                                <span class="text-[10px] opacity-60">Нажмите, чтобы включить</span>
                            </div>
                        </div>`;
                } else if (msg.type === 'file') {
                    content += `
                        <div class="flex items-center space-x-3 bg-black/30 p-3 rounded-lg border border-black/20 cursor-pointer hover:bg-black/50 transition" onclick="downloadRemoteFile('${msg.dataUrl}', '${escapeHtml(msg.filename || 'file')}')">
                            <span class="text-3xl">📄</span>
                            <div class="flex flex-col max-w-[150px]">
                                <span class="font-bold text-sm truncate">${escapeHtml(msg.filename || 'Файл')}</span>
                                <span class="text-[10px] text-theme font-bold uppercase">Скачать</span>
                            </div>
                        </div>`;
                } else {
                    content += `<p class="text-sm sm:text-base break-words leading-relaxed">${escapeHtml(msg.text)}</p>`;
                }

                if(msg.isEdited) {
                    content += `<span class="text-[10px] text-neutral-400/80 ml-2 italic">(изменено)</span>`;
                }

                const bgClass = isMe ? 'bg-theme text-black rounded-br-sm' : 'bg-neutral-800 text-white rounded-bl-sm';

                // Галочки статуса — только для своих сообщений
                let statusHtml = '';
                if (isMe) {
                    if (msg.status === 'read') {
                        statusHtml = `<span class="text-[11px] text-blue-500 font-bold">✓✓</span>`;
                    } else if (msg.status === 'delivered') {
                        statusHtml = `<span class="text-[11px] opacity-60">✓✓</span>`;
                    } else {
                        statusHtml = `<span class="text-[11px] opacity-60">✓</span>`;
                    }
                }

                wrapper.innerHTML = `
                    <div class="max-w-[85%] sm:max-w-[70%] rounded-2xl p-3 shadow-md ${bgClass} relative">
                        ${content}
                        <div class="flex justify-end items-center mt-1 space-x-1 opacity-80">
                            <span class="text-[10px] font-mono">${msg.time || ''}</span>
                            ${statusHtml}
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });

            container.scrollTop = container.scrollHeight;
        }

        // Скачивание файлов с Cloudinary (или любого внешнего URL).
        // Прямой <a download> на чужом домене браузер часто просто открывает в новой вкладке
        // вместо скачивания, поэтому тянем как blob и скачиваем локальный URL.
        async function downloadRemoteFile(url, filename) {
            try {
                showToast("Скачивание...");
                const response = await fetch(url);
                if (!response.ok) throw new Error('fetch failed');
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename || 'downloaded_file';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (e) {
                // Фолбэк — открыть в новой вкладке, если fetch не сработал (например, CORS)
                window.open(url, '_blank');
            }
        }

        // --- ГЛОБАЛЬНЫЙ МУЗЫКАЛЬНЫЙ ПЛЕЕР ---
        // Плейлист пересобирается из аудио-сообщений активного чата каждый раз, когда запускается трек.

        function buildPlaylistFromActiveChat() {
            const chat = state.chats[state.activeChat];
            if (!chat) return [];
            return chat.messages
                .filter(m => m.type === 'audio' && !m.isDeleted)
                .map(m => ({ id: m.id, filename: m.filename || 'Аудио', dataUrl: m.dataUrl }));
        }

        function playAudioMessage(msgId) {
            playerState.playlist = buildPlaylistFromActiveChat();
            const idx = playerState.playlist.findIndex(t => t.id === msgId);
            if (idx === -1) return;
            loadAndPlayTrack(idx);
        }

        function loadAndPlayTrack(index) {
            if (index < 0 || index >= playerState.playlist.length) return;
            playerState.currentIndex = index;
            const track = playerState.playlist[index];

            const audio = globalAudioEl();
            audio.src = track.dataUrl;
            audio.volume = getSavedVolume() / 100;
            audio.play().then(() => {
                playerState.isPlaying = true;
                updatePlayerUI();
            }).catch(() => {
                showToast("Не удалось воспроизвести аудио", "error");
            });

            document.getElementById('music-player-bar').classList.remove('hidden', 'collapsed');
            updatePlayerTrackInfo();
            updateAudioMessagePlayIcons();
        }

        function playerTogglePlay() {
            const audio = globalAudioEl();
            if (!audio.src) return;
            if (playerState.isPlaying) {
                audio.pause();
                playerState.isPlaying = false;
            } else {
                audio.play().catch(() => {});
                playerState.isPlaying = true;
            }
            updatePlayerUI();
        }

        function playerNext() {
            if (playerState.currentIndex < playerState.playlist.length - 1) {
                loadAndPlayTrack(playerState.currentIndex + 1);
            } else {
                showToast("Это последний трек в чате");
            }
        }

        function playerPrev() {
            if (playerState.currentIndex > 0) {
                loadAndPlayTrack(playerState.currentIndex - 1);
            } else {
                showToast("Это первый трек в чате");
            }
        }

        function closePlayer() {
            const audio = globalAudioEl();
            audio.pause();
            audio.src = '';
            playerState = { playlist: [], currentIndex: -1, isPlaying: false };
            document.getElementById('music-player-bar').classList.add('hidden', 'collapsed');
            updateAudioMessagePlayIcons();
        }

        function seekPlayer(event) {
            const audio = globalAudioEl();
            if (!audio.duration) return;
            const track = document.getElementById('player-progress-track');
            const rect = track.getBoundingClientRect();
            const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
            audio.currentTime = ratio * audio.duration;
        }

        // --- ГРОМКОСТЬ ПЛЕЕРА ---
        // Уровень громкости хранится в localStorage отдельно от основного state — это чисто
        // настройка воспроизведения, не имеет смысла синхронизировать между устройствами.
        const VOLUME_STORAGE_KEY = 'framework_msg_volume';

        function getSavedVolume() {
            const raw = localStorage.getItem(VOLUME_STORAGE_KEY);
            const val = raw !== null ? parseInt(raw, 10) : 100;
            return isNaN(val) ? 100 : Math.min(100, Math.max(0, val));
        }

        function setPlayerVolume(value) {
            const percent = Math.min(100, Math.max(0, parseInt(value, 10)));
            const audio = globalAudioEl();
            audio.volume = percent / 100;
            localStorage.setItem(VOLUME_STORAGE_KEY, String(percent));

            const slider = document.getElementById('player-volume-slider');
            const valueLabel = document.getElementById('player-volume-value');
            if (slider) slider.value = percent;
            if (valueLabel) valueLabel.innerText = percent + '%';

            updateVolumeIcon(percent);
        }

        function updateVolumeIcon(percent) {
            const icon = document.getElementById('player-volume-icon');
            if (!icon) return;
            if (percent === 0) {
                // Иконка "звук выключен"
                icon.innerHTML = '<path d="M16.5 12A4.5 4.5 0 0014 8v1.5a3 3 0 010 5H14V16a4.5 4.5 0 002.5-4zM19 12a7 7 0 00-7-7v1.5a5.5 5.5 0 010 11V19a7 7 0 007-7z" opacity="0"></path><path d="M3 10v4h4l5 5V5L7 10H3z"></path><path d="M16.5 4.5L4.5 16.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"></path>';
            } else if (percent < 50) {
                // Иконка "тихо"
                icon.innerHTML = '<path d="M3 10v4h4l5 5V5L7 10H3zm10.5 2c0-1.1-.6-2.06-1.5-2.58v5.15c.9-.51 1.5-1.47 1.5-2.57z"></path>';
            } else {
                // Иконка "громко" (по умолчанию в разметке)
                icon.innerHTML = '<path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>';
            }
        }

        function toggleVolumePopup(event) {
            event.stopPropagation();
            const popup = document.getElementById('volume-popup');
            popup.classList.toggle('hidden');
        }

        // Закрываем попап громкости при клике вне него — навешивается один раз при старте
        function setupVolumePopupOutsideClick() {
            document.addEventListener('click', (e) => {
                const popup = document.getElementById('volume-popup');
                if (!popup || popup.classList.contains('hidden')) return;
                if (!e.target.closest('#volume-popup') && !e.target.closest('#player-volume-btn')) {
                    popup.classList.add('hidden');
                }
            });
        }

        function formatPlayerTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updatePlayerTrackInfo() {
            const track = playerState.playlist[playerState.currentIndex];
            const nameEl = document.getElementById('player-track-name');
            if (nameEl && track) nameEl.innerText = track.filename;
        }

        function updatePlayerUI() {
            const playIcon = document.getElementById('player-play-icon');
            const pauseIcon = document.getElementById('player-pause-icon');
            if (playerState.isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
            updateAudioMessagePlayIcons();
        }

        // Синхронизирует иконку play/pause внутри пузыря сообщения с состоянием глобального плеера —
        // если сейчас играет именно это сообщение, показываем паузу, иначе play.
        function updateAudioMessagePlayIcons() {
            document.querySelectorAll('.audio-msg-play-icon').forEach(icon => {
                const msgId = icon.getAttribute('data-msg-id');
                const isCurrent = playerState.currentIndex >= 0 &&
                    playerState.playlist[playerState.currentIndex] &&
                    playerState.playlist[playerState.currentIndex].id === msgId;
                const isPlayingThis = isCurrent && playerState.isPlaying;
                icon.innerHTML = isPlayingThis
                    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>'
                    : '<path d="M8 5v14l11-7z"></path>';
            });
        }

        // Слушатели глобального <audio> элемента — навешиваются один раз при старте
        function setupGlobalAudioListeners() {
            const audio = globalAudioEl();
            audio.addEventListener('timeupdate', () => {
                if (!audio.duration) return;
                const percent = (audio.currentTime / audio.duration) * 100;
                const fill = document.getElementById('player-progress-fill');
                if (fill) fill.style.width = percent + '%';
                const curEl = document.getElementById('player-time-current');
                if (curEl) curEl.innerText = formatPlayerTime(audio.currentTime);
            });
            audio.addEventListener('loadedmetadata', () => {
                const durEl = document.getElementById('player-time-duration');
                if (durEl) durEl.innerText = formatPlayerTime(audio.duration);
            });
            audio.addEventListener('ended', () => {
                if (playerState.currentIndex < playerState.playlist.length - 1) {
                    loadAndPlayTrack(playerState.currentIndex + 1);
                } else {
                    playerState.isPlaying = false;
                    updatePlayerUI();
                }
            });

            // Применяем сохранённую громкость сразу, до первого воспроизведения
            const savedVolume = getSavedVolume();
            audio.volume = savedVolume / 100;
            setPlayerVolume(savedVolume);
            setupVolumePopupOutsideClick();
        }

        // --- ВВОД И ОТПРАВКА ---
        function autoResizeInput() {
            const el = document.getElementById('message-input');
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function detectMessageType(file) {
            if (file.type.startsWith('image/')) return 'image';
            if (file.type.startsWith('audio/')) return 'audio';
            return 'file';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            if(file.size > MAX_FILE_SIZE_BYTES) {
                showToast(`Файл слишком большой! Максимум ${Math.round(MAX_FILE_SIZE_BYTES / 1024 / 1024)} МБ.`, "error");
                event.target.value = '';
                return;
            }

            const type = detectMessageType(file);
            uploadFileToCloudinary(file, type);
            event.target.value = '';
        }

        // Прямая загрузка в Cloudinary через unsigned preset, с прогресс-тостом.
        // XMLHttpRequest используется вместо fetch, потому что только он даёт upload progress event.
        function uploadFileToCloudinary(file, type) {
            const progressToastId = showProgressToast(`Загрузка: ${file.name}`);

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', CLOUDINARY_UPLOAD_URL, true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    updateProgressToast(progressToastId, percent);
                }
            };

            xhr.onload = () => {
                removeProgressToast(progressToastId);
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        pushMessageToStateAndDb({
                            type: type,
                            dataUrl: data.secure_url,
                            filename: file.name,
                            fileSize: file.size
                        });
                    } catch (e) {
                        showToast("Ошибка обработки ответа сервера", "error");
                    }
                } else {
                    let errMsg = "Ошибка загрузки файла";
                    try {
                        const errData = JSON.parse(xhr.responseText);
                        if (errData.error && errData.error.message) errMsg = errData.error.message;
                    } catch(e) {}
                    showToast(errMsg, "error");
                }
            };

            xhr.onerror = () => {
                removeProgressToast(progressToastId);
                showToast("Ошибка сети при загрузке файла", "error");
            };

            xhr.send(formData);
        }

        // --- ПРОГРЕСС-ТОСТ ДЛЯ ЗАГРУЗКИ ---
        function showProgressToast(label) {
            const container = document.getElementById('toast-container');
            const id = 'progress-' + Date.now();
            const el = document.createElement('div');
            el.id = id;
            el.className = "bg-neutral-800 border border-neutral-700 text-white px-4 py-2.5 rounded-2xl font-bold text-xs shadow-xl fade-in min-w-[220px] pointer-events-auto";
            el.innerHTML = `
                <div class="flex justify-between mb-1.5">
                    <span class="truncate max-w-[160px]">${escapeHtml(label)}</span>
                    <span class="progress-percent shrink-0 ml-2 text-theme">0%</span>
                </div>
                <div class="w-full h-1.5 bg-neutral-700 rounded-full overflow-hidden">
                    <div class="progress-bar-fill h-full bg-theme transition-all duration-150" style="width: 0%"></div>
                </div>
            `;
            container.appendChild(el);
            return id;
        }

        function updateProgressToast(id, percent) {
            const el = document.getElementById(id);
            if (!el) return;
            const fill = el.querySelector('.progress-bar-fill');
            const label = el.querySelector('.progress-percent');
            if (fill) fill.style.width = percent + '%';
            if (label) label.innerText = percent + '%';
        }

        function removeProgressToast(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 300);
        }

        function submitMessage() {
            if(!state.activeChat) return;
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text) return;

            const roomId = getChatRoomId(state.currentUser.phone, state.activeChat);

            // Сбрасываем индикатор "печатает" сразу при отправке
            clearTimeout(typingTimeout);
            set(ref(db, `typing/${roomId}/${state.currentUser.phone}`), null);

            if(actionState.type === 'edit') {
                const chat = state.chats[state.activeChat];
                const msg = chat.messages.find(m => m.id === actionState.messageId);
                if(msg) {
                    msg.text = text;
                    msg.isEdited = true;
                    saveState();
                    renderActiveChat();

                    if (msg.dbKey) {
                        update(ref(db, `messages/${roomId}/${msg.dbKey}`), {
                            text: text,
                            isEdited: true
                        });
                    }
                }
                cancelMessageAction();
                return;
            }

            pushMessageToStateAndDb({
                type: 'text',
                text: text,
                replyToText: actionState.type === 'reply' ? actionState.messageText : null
            });

            cancelMessageAction();
        }

        function pushMessageToStateAndDb(msgData, targetPhoneOverride) {
            const targetPhone = targetPhoneOverride || state.activeChat;
            const chat = state.chats[targetPhone];
            if (!chat) return;

            const roomId = getChatRoomId(state.currentUser.phone, targetPhone);
            const dbRef = push(ref(db, 'messages/' + roomId));

            const newMsg = {
                id: dbRef.key,
                dbKey: dbRef.key,
                sender: 'me',
                senderPhone: state.currentUser.phone,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                status: 'sent',
                ...msgData
            };

            chat.messages.push(newMsg);
            saveState();
            if (state.activeChat === targetPhone) renderActiveChat();
            renderChatsList();

            set(dbRef, {
                id: dbRef.key,
                senderPhone: state.currentUser.phone,
                senderName: state.currentUser.nickname,
                time: newMsg.time,
                status: 'sent',
                ...msgData
            }).catch(() => showToast("Ошибка отправки", "error"));
        }

        // --- МОДАЛКИ (ОТКРЫТЬ/ЗАКРЫТЬ) ---
        function closeModal(id) {
            const el = document.getElementById(id);
            el.classList.remove('fade-in');
            el.classList.add('hidden');
            setTimeout(() => el.classList.add('fade-in'), 100);
        }

        function openFriendsModal() { document.getElementById('friend-modal').classList.remove('hidden'); }
        function toggleEditContactModal() {
            if(!state.activeChat) return;
            document.getElementById('edit-contact-name-input').value = state.chats[state.activeChat].name;
            document.getElementById('edit-contact-modal').classList.remove('hidden');
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            if(file.size > 2 * 1024 * 1024) {
                return showToast("Фото слишком большое! Максимум 2 МБ", "error");
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                state.currentUser.avatar = dataUrl;
                state.userAvatars[state.currentUser.phone] = dataUrl;
                document.getElementById('profile-modal-avatar-preview').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;

                update(ref(db, 'users/' + state.currentUser.phone), {
                    avatar: dataUrl
                });

                saveState();
                updateProfileUI();
            };
            reader.readAsDataURL(file);
        }

        function openMyProfileModal() {
            document.getElementById('my-profile-name-input').value = state.currentUser.nickname;
            document.getElementById('my-profile-password-input').value = "";
            document.getElementById('my-profile-ring-color').value = state.currentUser.ringColor || "#22c55e";

            const preview = document.getElementById('profile-modal-avatar-preview');
            if (state.currentUser.avatar && state.currentUser.avatar.startsWith('data:image')) {
                preview.innerHTML = `<img src="${state.currentUser.avatar}" class="w-full h-full object-cover">`;
            } else {
                preview.innerHTML = `<span class="text-3xl">🦆</span>`;
            }

            document.getElementById('my-profile-modal').classList.remove('hidden');
        }

        // --- УПРАВЛЕНИЕ КОНТАКТАМИ ---
        function submitAddFriend() {
            const rawPhone = document.getElementById('friend-phone').value.trim();
            const phone = rawPhone.replace(/[^0-9+]/g, '');
            const name = document.getElementById('friend-name').value.trim() || phone;

            if(!phone) return showToast("Введите корректный номер", "error");
            if(phone === state.currentUser.phone) return showToast("Нельзя добавить себя", "error");

            if(!state.chats[phone]) {
                state.chats[phone] = { name: name, messages: [] };

                update(ref(db, `users/${state.currentUser.phone}/contacts/${phone}`), {
                    name: name,
                    addedAt: Date.now()
                });

                loadUserAvatar(phone);
                listenToRoomMessages(phone);
                listenToPresence(phone);

                saveState();
                renderChatsList();
                showToast("Контакт добавлен");
            }
            closeModal('friend-modal');
        }

        function saveContactChanges() {
            const newName = document.getElementById('edit-contact-name-input').value.trim();
            if(newName && state.activeChat) {
                state.chats[state.activeChat].name = newName;

                update(ref(db, `users/${state.currentUser.phone}/contacts/${state.activeChat}`), {
                    name: newName
                });

                saveState();
                renderChatsList();
                renderActiveChat();
                showToast("Имя сохранено");
            }
            closeModal('edit-contact-modal');
        }

        function deleteCurrentContact() {
            if(!state.activeChat) return;

            remove(ref(db, `users/${state.currentUser.phone}/contacts/${state.activeChat}`));

            delete state.chats[state.activeChat];
            delete state.contacts[state.activeChat];
            delete state.userAvatars[state.activeChat];
            delete activeMessageListeners[state.activeChat];
            delete activePresenceListeners[state.activeChat];
            state.activeChat = null;
            saveState();

            renderChatsList();
            renderActiveChat();

            if(window.innerWidth < 768) {
                backToChats();
            }

            closeModal('edit-contact-modal');
            showToast("Контакт удален", "error");
        }

        // --- УПРАВЛЕНИЕ ПРОФИЛЕМ ---
        async function saveMyProfileChanges() {
            const newNick = document.getElementById('my-profile-name-input').value.trim();
            const newPass = document.getElementById('my-profile-password-input').value.trim();
            const newColor = document.getElementById('my-profile-ring-color').value;

            if(newNick) state.currentUser.nickname = newNick;
            if(newPass) state.currentUser.passwordHash = await hashPassword(newPass);
            state.currentUser.ringColor = newColor;

            update(ref(db, 'users/' + state.currentUser.phone), {
                nickname: state.currentUser.nickname,
                passwordHash: state.currentUser.passwordHash,
                password: null, // подчищаем старое поле, если было
                ringColor: state.currentUser.ringColor,
                avatar: state.currentUser.avatar || null
            });

            saveState();
            updateProfileUI();
            closeModal('my-profile-modal');
            showToast("Настройки профиля сохранены");
        }
    </script>
</body>
</html>
